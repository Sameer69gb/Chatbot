<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- <link rel="icon" type="image/png" href="https://i.ibb.co/KzsdPTrW/chatbot-favicon-cropped.png"> -->

  <link rel="manifest" href="/static/manifest.json">

  <title>AXIO Bot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(circle at top left, #e8f1ff 0%, transparent 35%),
        radial-gradient(circle at bottom right, #dce9ff 0%, transparent 35%),
        #f4f7fb;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100dvh;
      padding: 18px;
    }


    #chat-app {
      width: min(100%, 520px);
      height: min(760px, calc(100dvh - 36px));
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;

      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 26px;
      overflow: hidden;
      box-shadow:
        0 25px 70px rgba(31, 60, 100, 0.16),
        0 4px 15px rgba(31, 60, 100, 0.06);
    }


    #chat-header {
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid #edf1f6;
    }

    .bot-avatar {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .header-info {
      flex: 1;
    }

    #chat-header h2 {
      font-size: 17px;
      line-height: 1.2;
      color: #111827;
      font-weight: 750;
      letter-spacing: -0.3px;
    }

    .status {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #64748b;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar {
      width: 6px;
    }
    #messages::-webkit-scrollbar-thumb {
      background: #d7deea;
      border-radius: 20px;
    }

    .msg {
      display: flex;
      align-items: flex-end;
      gap: 9px;
      max-width: 88%;
      animation: messageIn 0.22s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg.bot {
      align-self: flex-start;
    }

    .msg-avatar {
      height: 30px;
      flex-shrink: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      width: 30px;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .msg.bot .msg-avatar {
      color: #2563eb;
      background: #eaf1ff;
    }

    .msg.user .msg-avatar {
      color: #475569;
      background: #e9eef5;
    }
    .bubble {
      padding: 11px 14px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      box-shadow: 0 2px 7px rgba(15, 23, 42, 0.04);
    }

    .msg.bot .bubble {
      background: #f1f5f9;
      color: #172033;
      border-bottom-left-radius: 5px;
    }

    .msg.user .bubble {
      background:linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      border-bottom-right-radius: 5px;
      box-shadow: 0 7px 18px rgba(37, 99, 235, 0.18);
    }
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 2px 1px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
      animation: typing 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%,60%,100% {
        transform: translateY(0);
        opacity: 0.35;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    #input-area {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.94);
      border-top: 1px solid #edf1f6;
      padding-bottom:
        max(14px, env(safe-area-inset-bottom));
    }

    #user-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 16px;
      border: 1px solid #dce3ed;
      border-radius: 16px;
      outline: none;
      background: #f8fafc;
      color: #172033;
      font-size: 14px;
      font-family: inherit;
      transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
    }

    #user-input::placeholder {
      color: #94a3b8;
    }

    #user-input:focus {
      background: white;
      border-color: #6b8cff;
      box-shadow:0 0 0 4px rgba(79, 70, 229, 0.08);
    }

    #send-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background:linear-gradient(135deg, #2563eb, #4f46e5);
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
      transition:
        transform 0.15s,
        box-shadow 0.15s,
        opacity 0.15s;
    }

    #send-btn:hover {
      transform: translateY(-1px);
      box-shadow:0 11px 22px rgba(37, 99, 235, 0.28);
    }

    #send-btn:active {
      transform: scale(0.94);
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #send-btn svg {
      width: 19px;
      height: 19px;
      fill: white;
    }

    @media (max-width: 700px) {

      body {
        padding: 12px;
      }

      #chat-app {
        height: calc(100dvh - 24px);
        border-radius: 22px;
      }

    }

    @media (max-width: 480px) {

      body {
        padding: 0;
        background: #f8fafc;
      }

      #chat-app {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }

      #chat-header {
        min-height: 70px;
        padding: 12px 15px;
      }

       #chat-header h2 {
        font-size: 16px;
      }

      .bot-avatar {
        width: 42px;
        height: 42px;
        border-radius: 13px;
      }

      #messages {
        padding: 18px 13px;
        gap: 14px;
      }

      .msg {
        max-width: 91%;
      }

      .bubble {
        font-size: 14px;
        padding: 10px 13px;
      }

      #input-area {
        padding:
          10px 11px max(10px, env(safe-area-inset-bottom));
      }

      #user-input {
        height: 44px;
        border-radius: 15px;
      }

      #send-btn {
        width: 44px;
        height: 44px;
        border-radius: 14px;
      }

    }

     @media (max-width: 360px) {

      #messages {
        padding-left: 9px;
        padding-right: 9px;
      }

      .msg {
        max-width: 94%;
      }

      .msg-avatar {
        width: 27px;
        height: 27px;
      }

      .bubble {
        font-size: 13px;
      }

    }
  </style>
</head>

<body>

  <div id="chat-app">

    <div id="chat-header">

      <div class="bot-avatar">
        AI
      </div>

      <div class="header-info">

        <h2>AXIO Bot</h2>

        <div class="status">
          <span class="status-dot"></span>
          <span>Online</span>
        </div>

      </div>

    </div>

    <div id="messages">

      <div class="msg bot">

        <div class="msg-avatar">
          AI
        </div>

        <div class="bubble">
          Sam tumhara AI assistant hun. Mujhse kuch bhi poocho
        </div>

      </div>

    </div>
    <div id="input-area">

      <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" />

      <button id="send-btn" aria-label="Send message">

        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>

    </div>

  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const messagesDiv = document.getElementById('messages');
      const input =document.getElementById('user-input');
      const sendBtn =document.getElementById('send-btn');
      const conversationHistory = [];
      function addMessage(text, role) {
        const msg =document.createElement('div');
        msg.className =
          'msg ' + role;
        const avatar =document.createElement('div');
        avatar.className =
          'msg-avatar';
        avatar.textContent =
          role === 'bot' ? 'AI' : 'Me';
        const bubble =
          document.createElement('div');
        bubble.className =
          'bubble';
        bubble.textContent =
          text;
        msg.appendChild(avatar);
        msg.appendChild(bubble);
        messagesDiv.appendChild(msg);
        messagesDiv.scrollTop =messagesDiv.scrollHeight;
      }
      function showTyping() {
        const msg =
          document.createElement('div');
        msg.className =
          'msg bot';
        msg.id =
          'typing-msg';
        const avatar =document.createElement('div');
        avatar.className =
          'msg-avatar';
        avatar.textContent =
          'AI';
        const bubble =document.createElement('div');
        bubble.className =
          'bubble';

        bubble.innerHTML =
          '<div class="typing-indicator">' +
          '<div class="dot"></div>' +
          '<div class="dot"></div>' +
          '<div class="dot"></div>' +
          '</div>';
        msg.appendChild(avatar);
        msg.appendChild(bubble);
        messagesDiv.appendChild(msg);
        messagesDiv.scrollTop =
          messagesDiv.scrollHeight;
      }
      function removeTyping() {
        const typing =
          document.getElementById('typing-msg');
        if (typing) {
          typing.remove();
        }
      }
      async function sendMessage() {
        const text =
          input.value.trim();
        if (!text) return;
        addMessage(text, 'user');
        conversationHistory.push({
          role: 'user',
          content: text
        });
        input.value = '';
        sendBtn.disabled = true;
        showTyping();
        try {
          const response =
            await fetch(
              'https://chatbot-1-w4pw.onrender.com/chat',
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body: JSON.stringify({
                  messages:
                    conversationHistory
                })
              }
            );
          const data =
            await response.json();
          removeTyping();
          const reply =
            data.reply ||
            'Error aaya 😅';
          conversationHistory.push({
            role: 'assistant',
            content: reply
          });
          addMessage(reply, 'bot');
        } catch (err) {
          removeTyping();
          addMessage(
            'Server nahi mila!',
            'bot'
          );
        }
        sendBtn.disabled = false;
        input.focus();
      }
      sendBtn.addEventListener(
        'click',
        sendMessage
      );
      input.addEventListener(
        'keydown',
        e => {
          if (e.key === 'Enter') {
            sendMessage();
          }

        }
      );
    });

  </script>

</body>

</html>
