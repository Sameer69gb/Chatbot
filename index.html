<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="https://i.ibb.co/KzsdPTrW/chatbot-favicon-cropped.png">
  <link rel="manifest" href="/static/manifest.json">
  <title>AXIO Bot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #chat-app {
      display: flex;
      flex-direction: column;
      width: 420px;
      height: 580px;
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    #chat-header {
      padding: 14px 18px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8f9fa;
    }
    .bot-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: #185FA5;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: #fff; font-weight: 500;
    }
    #chat-header h2 { font-size: 15px; font-weight: 600; color: #111; }
    #chat-header p  { font-size: 12px; color: #3B6D11; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      display: flex;
      gap: 8px;
      max-width: 85%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      flex-shrink: 0; margin-top: 2px;
    }
    .msg.bot  .msg-avatar { background: #E6F1FB; color: #185FA5; }
    .msg.user .msg-avatar { background: #EAF3DE; color: #3B6D11; }

    .bubble {
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
    }
    .msg.bot  .bubble { background: #f1f3f5; color: #111; border-top-left-radius: 4px; }
    .msg.user .bubble { background: #185FA5; color: #fff; border-top-right-radius: 4px; }

    .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #888; animation: blink 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    #input-area {
      padding: 12px 14px;
      border-top: 1px solid #eee;
      display: flex; gap: 8px;
      background: #fff;
    }
    #user-input {
      flex: 1; padding: 9px 13px;
      border: 1px solid #ccc; border-radius: 20px;
      font-size: 14px; font-family: sans-serif;
      background: #f8f9fa; color: #111; outline: none;
    }
    #user-input:focus { border-color: #185FA5; }

    #send-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: #185FA5; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.15s;
    }
    #send-btn:hover    { background: #0C447C; }
    #send-btn:disabled { background: #B5D4F4; cursor: not-allowed; }
    #send-btn svg { width: 16px; height: 16px; fill: #fff; }
  </style>
</head>
<body>

<div id="chat-app">
  <div id="chat-header">
    <div class="bot-avatar">Ai</div>
    <div>
      <h2>AXIO Bot</h2>
      <p>Online</p>
    </div>
  </div>

  <div id="messages">
    <div class="msg bot">
      <div class="msg-avatar">AI</div>
      <div class="bubble">Sam tumhara AI assistant hun. Mujhse kuch bhi poocho</div>
    </div>
  </div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="Type your message..." />
    <button id="send-btn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>
 <script>
document.addEventListener("DOMContentLoaded", () => {

  const messagesDiv = document.getElementById('messages');
  const input = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const conversationHistory = [];

  function addMessage(text, role) {
    const msg = document.createElement('div');
    msg.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'bot' ? 'AI' : 'Me';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function showTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = 'typing-msg';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = 'AI';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-msg');
    if (t) t.remove();
  }

  async function sendMessage() {
    console.log("Function chal gaya 🔥");

    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    conversationHistory.push({ role: 'user', content: text });

    input.value = '';
    sendBtn.disabled = true;
    showTyping();

    try {
      const response = await fetch('https://chatbot-1-w4pw.onrender.com/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversationHistory })
      });

      const data = await response.json();
      removeTyping();

      const reply = data.reply || 'Error aaya 😅';
      conversationHistory.push({ role: 'assistant', content: reply });
      addMessage(reply, 'bot');

    } catch (err) {
      removeTyping();
      addMessage('Server nahi mila!', 'bot');
    }

    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

});
</script>

</body>
</html>
